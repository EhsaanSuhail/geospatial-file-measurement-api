name: geomeasure

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geomeasure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geomeasure}
      POSTGRES_DB: ${POSTGRES_DB:-geomeasure}
    ports:
      # Published on localhost only, for running the API or tests outside Docker.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-geomeasure}:${POSTGRES_PASSWORD:-geomeasure}@db:5432/${POSTGRES_DB:-geomeasure}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-geomeasure}:${POSTGRES_PASSWORD:-geomeasure}@db:5432/${POSTGRES_DB:-geomeasure}_test
    depends_on:
      db:
        condition: service_healthy

  # Optional demo interface: docker compose --profile demo up --build
  demo:
    profiles: ["demo"]
    build:
      context: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "${DEMO_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
